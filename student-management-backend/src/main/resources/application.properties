# ==========================================
# APPLICATION
# ==========================================

spring.application.name=student-management-backend

server.port=8082


# ==========================================
# SQL SERVER - SQL SERVER AUTHENTICATION
# ==========================================

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=student_management;encrypt=true;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=123456

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# ==========================================
# CORS - REACT FRONTEND
# ==========================================

spring.web.cors.allowed-origins=http://localhost:5173

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*