# ==========================================
# APPLICATION
# ==========================================
spring.application.name=student-management-backend

# Render par port 8080 use hota hai
server.port=8080


# ==========================================
# DATABASE CONFIGURATION (NEON POSTGRESQL)
# ==========================================
# Humne yahan variables use kiye hain jo hum Render ke dashboard mein dalenge
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# PostgreSQL ka driver
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# SQL Server ki jagah ab PostgreSQL dialect use hoga
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# CORS - REACT FRONTEND
# ==========================================
# Jab aap apna frontend Vercel par deploy karenge, to wahan ka URL yahan dalna hoga.
# Filhal humne "*" rakha hai taake deploy ke waqt koi masla na aaye, baad mein ise Vercel ke URL se replace kar lena.
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*